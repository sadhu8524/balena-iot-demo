version: "2.4"

services:

###############################################################################
# PYTHON DEVICE SIMULATOR
###############################################################################

  simulator:
    build:
      context: ./simulator

    restart: always

    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883

      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}

      FRIDGE_COUNT: 4
      COFFEE_COUNT: 4

      PUBLISH_INTERVAL: 5

    depends_on:
      - mosquitto

###############################################################################
# MQTT BROKER
###############################################################################

  mosquitto:
    build:
      context: ./mosquitto

    restart: always

    ports:
      - "1883:1883"

    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

###############################################################################
# INFLUXDB
###############################################################################

  influxdb:
    image: influxdb:2.7

    restart: always

    ports:
      - "8086:8086"

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin123
      DOCKER_INFLUXDB_INIT_ORG: balena-demo
      DOCKER_INFLUXDB_INIT_BUCKET: iot
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}

    volumes:
      - influxdb-data:/var/lib/influxdb2

###############################################################################
# TELEGRAF
###############################################################################

  telegraf:
    build:
      context: ./telegraf

    restart: always

    depends_on:
      - mosquitto
      - influxdb

    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
###############################################################################
# GRAFANA
###############################################################################

  grafana:
    image: grafana/grafana:latest

    restart: always

    depends_on:
      - influxdb

    ports:
      - "3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123

    volumes:
      - grafana-data:/var/lib/grafana

###############################################################################
# VOLUMES
###############################################################################

volumes:

  mosquitto-data:

  mosquitto-log:

  influxdb-data:

  grafana-data:
