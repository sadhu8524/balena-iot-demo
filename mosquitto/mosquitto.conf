# =====================================================
# Felfel Balena Demo MQTT Broker
# =====================================================


# MQTT listener
listener 1883


# Allow username/password authentication
allow_anonymous false


# Authentication file
password_file /mosquitto/config/passwd



# Persistence
persistence true

persistence_location /mosquitto/data/



# Logging

log_type all
log_dest stdout


# MQTT protocol version

protocol mqtt
